<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D3FD1">
<title>Dashboard de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <div class="login-box">
    <img src="entel.png" alt="Entel" class="login-logo">
    <h2>Acceso a Ventas</h2>
    <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
    <button class="btn" id="btn-login">Ingresar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="dashboard" hidden>
  <button class="menu-btn" id="btn-menu" aria-label="Menú">☰</button>
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo"><div class="logo-dot">GP</div><span>Equipo de ventas de Entel</span></div>

    <span class="nav-label">Vistas</span>
    <button class="nav-item active" data-view="resumen">Resumen general</button>
    <button class="nav-item" data-view="detalle">Detalle de ventas</button>
    <button class="nav-item" data-view="ejecutivos">Por ejecutivo</button>

    <span class="nav-label">Sistema</span>
    <button class="nav-item" id="btn-refresh">Actualizar datos</button>
    <button class="nav-item" id="btn-logout">Cerrar sesión</button>

    <div class="sidebar-footer">
      <div id="sidebar-status"></div>
      <div id="sidebar-count"></div>
    </div>
  </aside>

  <main class="main">
    <!-- Selector de mes: afecta a todas las vistas -->
    <div class="mesbar" id="mesbar" hidden>
      <label for="sel-mes">Mes</label>
      <select id="sel-mes"></select>
    </div>

    <section id="view-resumen" class="view active">
      <div class="topbar">
        <div>
          <h1 id="resumen-title">Resumen del mes actual</h1>
          <p id="resumen-subtitle"></p>
        </div>
        <div class="topbar-right">
          <select id="filtro-ej-resumen"></select>
          <img src="entel.png" alt="Entel" class="dashboard-logo">
        </div>
      </div>

      <div class="metrics" id="metrics"></div>

      <div class="grid2">
        <div class="card">
          <div class="card-head"><div class="card-title">Distribución de estados</div></div>
          <div class="donut-wrap">
            <canvas id="donutChart" width="160" height="160"></canvas>
            <div class="donut-legend" id="donutLegend"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-head">
            <div class="card-title">Progreso por ejecutivo</div>
            <div class="seg" id="ej-orden" role="group" aria-label="Ordenar ejecutivos">
              <button type="button" data-orden="generados" class="active" aria-pressed="true">Más generados</button>
              <button type="button" data-orden="instalados" aria-pressed="false">Más instalados</button>
            </div>
          </div>
          <div id="ej-bars"></div>
        </div>
      </div>

      <div class="card card-dias">
        <div class="card-head">
          <div class="card-title">Ventas ingresadas por día</div>
          <div class="dias-resumen" id="dias-resumen"></div>
        </div>
        <div class="chart-box"><canvas id="diasChart"></canvas></div>
        <div class="dias-nota" id="dias-nota"></div>
      </div>
    </section>

    <section id="view-detalle" class="view">
      <div class="topbar">
        <div><h1>Detalle de ventas</h1><p id="detalle-subtitle">Todos los registros de la hoja</p></div>
        <button class="btn admin-only" id="btn-nuevo">+ Nuevo registro</button>
      </div>
      <div class="table-card">
        <div class="table-header">
          <input type="search" id="f-nombre" placeholder="Buscar cliente, celular o referencia...">
          <button type="button" class="chip chip-filtros" id="btn-filtros" aria-expanded="false" aria-controls="filtros">Filtros</button>
          <button type="button" class="chip" id="f-ojo" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            Solo con Ojo
          </button>
          <div class="filtros" id="filtros">
            <select id="f-ejecutivo"></select>
            <select id="f-estado">
              <option value="todos">Todos los estados</option>
              <option value="I">Instalado</option>
              <option value="P">Pendiente</option>
              <option value="R">Rechazado</option>
              <option value="AM">Pendiente anterior mes</option>
            </select>
            <select id="f-plan"></select>
          </div>
        </div>
        <div class="v-count"><span id="count-detalle"></span><button type="button" class="sort-btn" data-sort></button></div>
        <div id="lista-detalle"></div>
      </div>
    </section>

    <section id="view-ejecutivos" class="view">
      <div class="topbar">
        <div><h1>Por ejecutivo</h1><p>Detalle individual de cada vendedor</p></div>
        <select id="sel-ej"></select>
      </div>
      <div class="metrics" id="metrics-ej"></div>
      <div class="table-card">
        <div class="table-header">
          <strong id="ej-table-title">Ventas</strong>
          <select id="f-estado-ej">
            <option value="todos">Todos los estados</option>
            <option value="I">Instalado</option>
            <option value="P">Pendiente</option>
            <option value="R">Rechazado</option>
            <option value="AM">Pendiente anterior mes</option>
          </select>
        </div>
        <div class="v-count"><span id="count-ej"></span><button type="button" class="sort-btn" data-sort></button></div>
        <div id="lista-ej"></div>
      </div>
    </section>
  </main>

  <!-- Modal CRUD (solo admin) -->
  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="form-reg">
      <h3 id="modal-title">Nuevo registro</h3>
      <label>Plan<input name="plan" required></label>
      <label>Estado
        <select name="estado">
          <option value="P">Pendiente</option>
          <option value="I">Instalado</option>
          <option value="R">Rechazado</option>
          <option value="AM">Pendiente anterior mes</option>
        </select>
      </label>
      <label>Ejecutivo<input name="ejecutivo" required list="lista-ej-datos"></label>
      <datalist id="lista-ej-datos"></datalist>
      <label>Cliente<input name="cliente" required></label>
      <label>Celular<input name="celular" inputmode="tel"></label>
      <label>Referencia<input name="referencia"></label>
      <label>Fecha de ingreso<input type="date" name="fecha"></label>
      <label>Fecha de instalación<input type="date" name="fecIns"></label>
      <label>Observaciones<textarea name="obs" rows="3"></textarea></label>
      <label class="check"><input type="checkbox" name="ojo"> Marcar con Ojo <small>(resalta este registro en la lista)</small></label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
        <button type="submit" class="btn" id="btn-save">Guardar cambios</button>
      </div>
      <div class="status-msg" id="form-status"></div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="app.js"></script>
</body>
</html>
